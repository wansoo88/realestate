<style>
:root{
  color-scheme: light dark;
  --accent:#0071e3; --accent-text:#0060c7; --accent-weak:rgba(0,113,227,.12); --on-accent:#fff;
  --bg:#fff; --bg-elev:#fff; --bg-grouped:#f2f2f7; --material:#fff;
  --hairline:rgba(60,60,67,.18); --hairline-strong:rgba(60,60,67,.29);
  --text:#000; --text-secondary:#636366; --text-estimated:#6b6b70;
  --badge-bg:rgba(120,120,128,.12);
  --warn:#ff9500; --warn-text:#b25000; --danger:#ff3b30; --danger-text:#d70015;
  --tag-station-bg:rgba(0,122,145,.12); --tag-station-fg:#0a6c7d;
  --tag-redev-bg:rgba(175,82,222,.12); --tag-redev-fg:#8a3fae;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
  --fs-caption:13px; --fs-footnote:15px; --fs-body:17px; --fs-title:20px;
  --fs-price:26px; --fs-large-title:32px;
  --ff:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",
       system-ui,"Malgun Gothic",sans-serif;
  --r-sheet:20px; --r-card:16px; --r-btn:12px; --r-pill:999px;
  --shadow-1:0 1px 3px rgba(0,0,0,.06);
  --touch-min:44px;
}
@media (prefers-color-scheme: dark){
  :root{
    --accent:#0a6fd8; --accent-text:#409fff; --accent-weak:rgba(10,111,216,.22);
    --bg:#000; --bg-elev:#1c1c1e; --bg-grouped:#000; --material:#000;
    --hairline:rgba(84,84,88,.4); --hairline-strong:rgba(84,84,88,.6);
    --text:#fff; --text-secondary:#aeaeb2; --text-estimated:#8e8e93;
    --badge-bg:rgba(120,120,128,.24);
    --warn:#ff9f0a; --warn-text:#ffb340; --danger:#ff453a; --danger-text:#ff6961;
    --tag-station-bg:rgba(64,200,224,.22); --tag-station-fg:#7fdcec;
    --tag-redev-bg:rgba(191,90,242,.22); --tag-redev-fg:#dfa6f5;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--ff);font-size:var(--fs-body);color:var(--text);
  background:var(--bg-grouped);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

header{padding:var(--sp-4);background:var(--bg);border-bottom:1px solid var(--hairline);
  position:sticky;top:0;z-index:5}
h1{font-size:var(--fs-title);font-weight:600;margin:0 0 var(--sp-1)}
.asof{font-size:var(--fs-caption);color:var(--text-estimated);margin:0;line-height:1.55}
main{padding:var(--sp-4) var(--sp-4) var(--sp-8);max-width:1120px;margin:0 auto}

.card{background:var(--bg-elev);border-radius:var(--r-card);padding:var(--sp-4);
  margin-bottom:var(--sp-4);box-shadow:var(--shadow-1)}
.card h2{font-size:var(--fs-footnote);font-weight:600;margin:0 0 var(--sp-1);letter-spacing:.01em}
.card h3{font-size:var(--fs-caption);font-weight:600;margin:var(--sp-5) 0 var(--sp-2);
  color:var(--text-secondary);text-transform:none}
.sub{font-size:var(--fs-caption);color:var(--text-secondary);margin:0 0 var(--sp-3);line-height:1.6}

.grid{display:grid;grid-template-columns:1fr;gap:var(--sp-4)}
@media (min-width:760px){.grid{grid-template-columns:1fr 1fr}}

/* 단지 카드 = 버튼(키보드 접근) */
.cx{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:var(--bg-elev);border:1px solid var(--hairline);border-radius:var(--r-card);
  padding:var(--sp-4);box-shadow:var(--shadow-1);-webkit-tap-highlight-color:transparent}
.cx:hover{border-color:var(--hairline-strong)}
.cx .nm{font-size:var(--fs-body);font-weight:600;line-height:1.3}
.cx .rg{font-size:var(--fs-caption);color:var(--text-secondary);margin-top:3px;line-height:1.5}
.cx .go{font-size:var(--fs-caption);color:var(--accent-text);margin-top:var(--sp-3);
  font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-btn)}

.chips{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-3)}
.chip{min-height:var(--touch-min);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-pill);
  border:1px solid var(--hairline);background:var(--bg-elev);font:inherit;
  font-size:var(--fs-caption);color:var(--text);cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);
  border-color:var(--accent);font-weight:600}

.toggle{display:flex;align-items:flex-start;gap:var(--sp-3);min-height:var(--touch-min);
  border:1px solid var(--hairline);border-radius:var(--r-btn);padding:var(--sp-3);
  background:var(--bg-elev);font:inherit;font-size:var(--fs-caption);color:var(--text);
  cursor:pointer;text-align:left;width:100%;margin-top:var(--sp-2)}
.toggle[aria-pressed=true]{border-color:var(--accent);background:var(--accent-weak)}
.toggle .box{flex:0 0 auto;width:20px;height:20px;border-radius:6px;
  border:1.5px solid var(--hairline-strong);display:grid;place-items:center;font-size:13px;
  line-height:1;color:var(--on-accent);margin-top:1px}
.toggle[aria-pressed=true] .box{background:var(--accent);border-color:var(--accent)}
.toggle .t{flex:1;line-height:1.5}
.toggle .t small{display:block;color:var(--text-secondary);font-size:12px;line-height:1.5;
  margin-top:3px}

.badge{display:inline-block;padding:2px var(--sp-2);border-radius:var(--r-pill);
  font-size:12px;background:var(--badge-bg);color:var(--text-secondary);line-height:1.5}
.badge--est{color:var(--text-estimated)}
.badge--warn{background:rgba(255,149,0,.14);color:var(--warn-text)}
.badge--bad{background:rgba(255,59,48,.10);color:var(--danger-text)}

.note{font-size:var(--fs-caption);line-height:1.65;color:var(--text-secondary);
  background:var(--badge-bg);border-radius:var(--r-btn);padding:var(--sp-3);margin-top:var(--sp-3)}
.note.warn{background:rgba(255,149,0,.12);color:var(--warn-text)}
.note.bad{background:rgba(255,59,48,.10);color:var(--danger-text)}
.note b,.note strong{font-weight:600}

.axis-list{list-style:none;margin:var(--sp-3) 0 0;padding:0;border-top:1px solid var(--hairline)}
.axis-list li{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-3) 0;
  border-bottom:1px solid var(--hairline)}
.axis-body{flex:1;min-width:0}
.axis-name{font-size:var(--fs-footnote);font-weight:600;display:flex;align-items:center;
  gap:var(--sp-2);flex-wrap:wrap}
.axis-name.dim{font-weight:400;color:var(--text-estimated)}
.axis-raw{font-size:var(--fs-caption);color:var(--text-secondary);margin:3px 0 0;line-height:1.6}
.axis-miss{font-size:var(--fs-caption);color:var(--text-estimated);margin:3px 0 0;line-height:1.6}
.axis-score{flex:0 0 auto;font-size:var(--fs-title);font-weight:600;
  font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.axis-score.dim{font-size:var(--fs-caption);font-weight:400;color:var(--text-estimated);
  padding-top:5px}

.total{display:flex;align-items:baseline;gap:var(--sp-2);margin:var(--sp-2) 0 0;flex-wrap:wrap}
.total .v{font-size:var(--fs-price);font-weight:600;font-variant-numeric:tabular-nums}
.total .u{font-size:var(--fs-footnote);color:var(--text-secondary)}
.total .none{font-size:var(--fs-footnote);color:var(--text-estimated)}

table.alt{width:100%;border-collapse:collapse;font-size:var(--fs-caption);margin-top:var(--sp-3)}
table.alt th,table.alt td{text-align:left;padding:6px var(--sp-2);
  border-bottom:1px solid var(--hairline);vertical-align:top}
table.alt th{color:var(--text-secondary);font-weight:600}
table.alt td.n{text-align:right;font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:none;font:inherit;font-size:var(--fs-caption);
  color:var(--accent-text);cursor:pointer;padding:var(--sp-2) 0;min-height:var(--touch-min);
  text-decoration:underline;text-underline-offset:3px}
.backbtn{background:var(--bg-elev);border:1px solid var(--hairline);border-radius:var(--r-btn);
  font:inherit;font-size:var(--fs-caption);color:var(--accent-text);cursor:pointer;
  min-height:var(--touch-min);padding:0 var(--sp-4);margin-bottom:var(--sp-3);font-weight:600}

label.fld{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-caption);
  color:var(--text-secondary);margin:var(--sp-2) 0;flex-wrap:wrap}
select,input[type=number]{font:inherit;font-size:var(--fs-caption);min-height:var(--touch-min);
  border:1px solid var(--hairline);border-radius:var(--r-btn);background:var(--bg-elev);
  color:var(--text);padding:0 var(--sp-3);max-width:160px}
svg{display:block;max-width:100%;height:auto;margin:0 auto}

/* 호가 사다리 */
.lad{list-style:none;margin:var(--sp-3) 0 0;padding:0;font-size:var(--fs-caption);line-height:1.6}
.lad li{display:flex;gap:var(--sp-2);padding:var(--sp-2) 0;border-bottom:1px solid var(--hairline);
  align-items:baseline}
.lad .k{flex:1;color:var(--text-secondary)}
.lad .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lad .top .k,.lad .top .v{color:var(--text);font-size:var(--fs-footnote)}
.lad .miss .v{font-weight:400;color:var(--text-estimated)}

/* SVG 클래스(다크모드 자동) */
.s-grid{fill:none;stroke:var(--hairline);stroke-width:1}
.s-spoke{stroke:var(--hairline-strong);stroke-width:1;fill:none}
.s-spoke-miss{stroke:var(--text-estimated);stroke-width:1;fill:none;stroke-dasharray:2 4;opacity:.8}
.s-poly{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.s-dot{fill:var(--accent);stroke:var(--bg-elev);stroke-width:1.5}
.s-dot-est{fill:var(--bg-elev);stroke:var(--accent);stroke-width:2}
.s-dot-miss{fill:none;stroke:var(--text-estimated);stroke-width:1.5;stroke-dasharray:2 2}
.s-lab{font-size:11px;fill:var(--text);font-weight:600}
.s-lab-dim{font-size:11px;fill:var(--text-estimated)}
.s-lab-sm{font-size:10px;fill:var(--text-secondary)}
.s-tick{font-size:10px;fill:var(--text-estimated)}
.s-ring-full{fill:var(--accent);fill-opacity:.85;stroke:none}
.s-ring-est{fill:var(--accent);fill-opacity:.30;stroke:var(--accent);stroke-width:1;stroke-opacity:.5}
.s-ring-none{fill:none;stroke:var(--text-estimated);stroke-width:1;stroke-dasharray:3 3;opacity:.8}
.s-ring-bed{fill:var(--badge-bg);stroke:none}
.s-hatch{stroke:var(--accent);stroke-width:2;opacity:.55}
.s-bar-bed{fill:var(--badge-bg)}
.s-bar{fill:var(--accent)}
.s-axisline{stroke:var(--hairline-strong);stroke-width:1}
.s-strip-bed{fill:var(--badge-bg)}
.s-mid{stroke:var(--text);stroke-width:1.5;stroke-dasharray:4 3;opacity:.55}
.s-dong{fill:var(--accent);fill-opacity:.85;stroke:var(--bg-elev);stroke-width:1.5}
.s-dong-low{fill:var(--text-estimated);fill-opacity:.55;stroke:var(--bg-elev);stroke-width:1.5}
.s-dong-raw{fill:none;stroke:var(--danger);stroke-width:1.5;stroke-dasharray:2 2}
.s-floor{fill:var(--tag-station-fg);fill-opacity:.85;stroke:var(--bg-elev);stroke-width:1.5}
.s-band{fill:var(--badge-bg)}
.s-ask{stroke:var(--danger);stroke-width:2}
</style>
</head>

/* 축 순서는 **상수로 고정**한다. 정렬 UI 를 주지 않는다 —

const AXES = ["school","transit","infra","liquidity","attr","trend"];
const LABEL = { school:"학군", transit:"교통", infra:"생활인프라", liquidity:"환금성",
                attr:"가격매력", trend:"가격추세" };

  attr:"가격매력(같은 구·면적대 대비 ₩/㎡)", trend:"가격추세(12개월 상승률)" };

/* 실측/추정 경계. backend/app/agents/base.py::ESTIMATE_CONFIDENCE_CAP 과 같은 값.
   프론트에서 새 숫자를 만들면 같은 데이터에 두 개의 진실이 생긴다. */
const ESTIMATE_CONFIDENCE_CAP = 0.6;
const GRADE_LABEL = { measured:"실측", estimated:"추정", missing:"미확보" };
function grade(a){
  if (!a || a.score === null || a.score === undefined) return "missing";
  return a.conf > ESTIMATE_CONFIDENCE_CAP ? "measured" : "estimated";
}

/* ── 소도구 ─────────────────────────────────────────────────────────────── */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, kids){
  const n = document.createElementNS(NS, tag);
  for (const k in (attrs||{})) if (attrs[k] !== null && attrs[k] !== undefined)
    n.setAttribute(k, attrs[k]);
  (kids||[]).forEach(c => c && n.appendChild(c));
  return n;
}
function txt(tag, attrs, s){ const n = el(tag, attrs); n.textContent = s; return n; }
/** DOM 헬퍼. **text 는 textContent** 로만 넣는다(XSS 방지).
 *  html 은 이 파일 안의 고정 문자열에만 쓰고 사용자 입력은 절대 넣지 않는다. */
function h(tag, attrs, kids){
  const n = document.createElement(tag);
  for (const k in (attrs||{})){
    if (k === "html") n.innerHTML = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  }
  (kids||[]).forEach(c => c && n.appendChild(c));
  return n;
}
function eok(v){
  if (v === null || v === undefined) return "—";
  const x = v / 1e8;
  return (x >= 10 ? x.toFixed(1) : x.toFixed(2)) + "억";
}
function pc(x, d){ return (x >= 0 ? "+" : "") + x.toFixed(d === undefined ? 1 : d) + "%"; }

/* ═══════════════════════════════════════════════════════════════════════════
   1. 육각 레이더 + 확신 링
   ─────────────────────────────────────────────────────────────────────────
   ① 넓이를 총점으로 쓰지 않는다 → 총점은 도형 **밖** 막대(§renderTotal)
   ④ 미확보 축은 **0 으로 그리지 않는다** — 다각형이 그 축을 건너뛴다.
      점선 스포크 + 끝의 ⌀ 마커로 "부재"가 아니라 "표식"이 되게 한다.
   ═══════════════════════════════════════════════════════════════════════════ */
function radar(c, opts){
  opts = opts || {};
  const SZ = opts.small ? 268 : 300, C = SZ/2, R = opts.small ? 78 : 92;
  const RIN = R + 14, ROUT = R + 26;
  const n = AXES.length;
  const ang = i => (-Math.PI/2) + (i * 2 * Math.PI / n);
  const pt = (i, r) => [C + Math.cos(ang(i))*r, C + Math.sin(ang(i))*r];
  const use = k => !(opts.dropTrend && k === "trend");

  const g = el("svg", { viewBox:"0 0 "+SZ+" "+SZ, width:SZ, height:SZ, role:"img",
    "aria-label": aria(c) });
  const uid = "h" + c.id;
  const defs = el("defs");
  const pat = el("pattern", { id:uid, width:6, height:6, patternUnits:"userSpaceOnUse",
    patternTransform:"rotate(45)" });
  pat.appendChild(el("line", { x1:0, y1:0, x2:0, y2:6, class:"s-hatch" }));
  defs.appendChild(pat); g.appendChild(defs);

  [25,50,75,100].forEach(v => {
    const p = []; for (let i=0;i<n;i++) p.push(pt(i, R*v/100).join(","));
    g.appendChild(el("polygon", { points:p.join(" "), class:"s-grid" }));
  });
  g.appendChild(txt("text", { x:C+3, y:C-R+10, class:"s-tick" }, "100"));

  /* 확신 링 — 안쪽 다각형(점수)과 **다른 도형**이라 절대 섞이지 않는다 */
  const seg = 2*Math.PI/n, pad = .045;
  AXES.forEach((k,i) => {
    const a = c.axes[k], a0 = ang(i)-seg/2+pad, a1 = ang(i)+seg/2-pad;
    g.appendChild(el("path", { d:arcBand(C,C,RIN,ROUT,a0,a1), class:"s-ring-bed" }));
    const gr = use(k) ? grade(a) : "missing";
    if (gr === "missing"){
      g.appendChild(el("path", { d:arcBand(C,C,RIN,ROUT,a0,a1), class:"s-ring-none" }));
    } else {
      const f = Math.max(.12, a.conf), am = a0 + (a1-a0)*f;
      g.appendChild(el("path", { d:arcBand(C,C,RIN,ROUT,a0,am),
        class: gr === "measured" ? "s-ring-full" : "s-ring-est",
        style: gr === "estimated" ? "fill:url(#"+uid+");fill-opacity:1" : null }));
    }
  });

  AXES.forEach((k,i) => {
    const [x,y] = pt(i,R), miss = !use(k) || grade(c.axes[k]) === "missing";
    g.appendChild(el("line", { x1:C, y1:C, x2:x, y2:y,
      class: miss ? "s-spoke-miss" : "s-spoke" }));
    if (miss) g.appendChild(el("circle", { cx:x, cy:y, r:4.5, class:"s-dot-miss" }));
  });

  /* 미확보 축은 좌표를 만들지 않고 **건너뛴다**(움푹 팬 자국이 생기지 않는다) */
  const pres = [];
  AXES.forEach((k,i) => {
    if (use(k) && grade(c.axes[k]) !== "missing") pres.push(pt(i, R*c.axes[k].score/100));
  });
  if (pres.length >= 3)
    g.appendChild(el("polygon", { points:pres.map(p=>p.join(",")).join(" "), class:"s-poly" }));
  else if (pres.length === 2)
    g.appendChild(el("line", { x1:pres[0][0], y1:pres[0][1], x2:pres[1][0], y2:pres[1][1],
      class:"s-poly", fill:"none" }));

  AXES.forEach((k,i) => {
    const gr = use(k) ? grade(c.axes[k]) : "missing";
    if (gr === "missing") return;
    const [x,y] = pt(i, R*c.axes[k].score/100);
    g.appendChild(el("circle", { cx:x, cy:y, r:4.5,
      class: gr === "measured" ? "s-dot" : "s-dot-est" }));
  });

  AXES.forEach((k,i) => {
    const a = c.axes[k];
    const [x,y] = pt(i, ROUT+13), miss = !use(k) || grade(a) === "missing";
    const anc = Math.abs(x-C) < 6 ? "middle" : (x > C ? "start" : "end");
    g.appendChild(txt("text", { x, y:y+4, class: miss?"s-lab-dim":"s-lab", "text-anchor":anc },
      LABEL[k]));
    /* 눈금 밖에서 잘린 값에는 화살표를 붙인다 — 0점과 100점이 '실제로 얼마나 더'인지
       숫자로는 알 수 없다는 사실을 그림에서 지우지 않기 위해서다(상·하단 정보 소실). */
    const mark = miss ? "" : (a.clipped || a.capped
      ? (a.score <= 0 ? " ↓" : (a.score >= 100 ? " ↑" : "")) : "");
    g.appendChild(txt("text", { x, y:y+17, class:"s-lab-sm", "text-anchor":anc },
      miss ? "미확보" : String(Math.round(a.score)) + mark));
  });
  return g;
}
function arcBand(cx,cy,r0,r1,a0,a1){
  const p=(r,a)=>[cx+Math.cos(a)*r, cy+Math.sin(a)*r];
  const lg=(a1-a0)>Math.PI?1:0;
  const [x0,y0]=p(r1,a0),[x1,y1]=p(r1,a1),[x2,y2]=p(r0,a1),[x3,y3]=p(r0,a0);
  return "M"+x0+","+y0+" A"+r1+","+r1+" 0 "+lg+" 1 "+x1+","+y1+" L"+x2+","+y2
       +" A"+r0+","+r0+" 0 "+lg+" 0 "+x3+","+y3+" Z";
}
function aria(c){
  const parts = AXES.map(k => LABEL[k]+" "+(c.axes[k].score === null ? "미확보"
    : Math.round(c.axes[k].score)+"점 "+GRADE_LABEL[grade(c.axes[k])]));
  return c.name+" 6축 프로필. "+parts.join(", ")+". 이 도형의 넓이는 총점이 아닙니다.";
}

/** 총점 막대 — **레이더 밖**에 둔다. 총점의 그림은 넓이가 아니라 이 막대다. */

  svg.appendChild(el("rect", { x:0, y:6, width:WD, height:14, rx:7, class:"s-bar-bed" }));
  if (tot !== null)
    svg.appendChild(el("rect", { x:0, y:6, width:WD*tot/100, height:14, rx:7, class:"s-bar" }));
  [25,50,75].forEach(v => svg.appendChild(el("line", { x1:WD*v/100, y1:4, x2:WD*v/100, y2:22,
    class:"s-axisline", opacity:.4 })));
  return { svg, tot, cov:Math.round(wsum*100) };
}

/* ═══════════════════════════════════════════════════════════════════════════
   2. 동/층 스트립 — **고정 절대 스케일 0.85~1.15**
   단지마다 스케일을 다시 잡으면 5% 편차와 20% 편차가 같은 그림이 된다.
   ═══════════════════════════════════════════════════════════════════════════ */
const SC_MIN = .85, SC_MAX = 1.15;
function strip(rows, opts){
  const WD = 320, PADL = 10, PADR = 10, iw = WD-PADL-PADR, H = 92;
  const xOf = r => PADL + (Math.min(SC_MAX,Math.max(SC_MIN,r))-SC_MIN)/(SC_MAX-SC_MIN)*iw;
  const svg = el("svg", { viewBox:"0 0 "+WD+" "+H, width:WD, height:H, role:"img",
    "aria-label":opts.aria });
  svg.appendChild(el("rect", { x:PADL, y:44, width:iw, height:16, rx:8, class:"s-strip-bed" }));
  [.85,.90,.95,1.00,1.05,1.10,1.15].forEach(t => {
    const x = xOf(t);
    svg.appendChild(el("line", { x1:x, y1:40, x2:x, y2:64, class:"s-axisline",
      opacity: t===1 ? 0 : .45 }));
    svg.appendChild(txt("text", { x, y:78, class:"s-tick", "text-anchor":"middle" },
      t.toFixed(2)));
  });
  const xm = xOf(1);
  svg.appendChild(el("line", { x1:xm, y1:30, x2:xm, y2:68, class:"s-mid" }));
  svg.appendChild(txt("text", { x:xm, y:24, class:"s-tick", "text-anchor":"middle" }, "단지 중위"));
  /* 미보정 대조군(붉은 점선 원) — 같은 데이터가 얼마나 달라 보이는지 */
  if (opts.ghost) opts.ghost.forEach(r => {
    if (r.ratio === null) return;
    svg.appendChild(el("circle", { cx:xOf(r.ratio), cy:52, r:5.5, class:"s-dong-raw" }));
  });
  rows.forEach(r => {
    if (r.ratio === null || r.ratio === undefined) return;
    const x = xOf(r.ratio), rad = 4 + Math.min(6, Math.sqrt(r.n));
    const clip = r.ratio < SC_MIN || r.ratio > SC_MAX;
    svg.appendChild(el("circle", { cx:x, cy:52, r:rad,
      class: opts.kind==="floor" ? "s-floor" : (r.ratio < 1 ? "s-dong-low" : "s-dong") }));
    svg.appendChild(txt("text", { x, y:38, class:"s-lab-sm", "text-anchor":"middle" },
      (clip ? (r.ratio < SC_MIN ? "\u2039" : "\u203A") : "") + r.label));
  });
  return svg;
}

/* 가격 분포 막대 — 호가 위치를 실거래 분포 위에 얹는다 */
function bandBar(p, ask){
  const WD = 320, H = 74, PADL = 8, PADR = 8, iw = WD-PADL-PADR;
  const lo = Math.min(p.p10, ask||p.p10)*.985, hi = Math.max(p.p90, ask||p.p90)*1.015;
  const xOf = v => PADL + (v-lo)/(hi-lo)*iw;
  const svg = el("svg", { viewBox:"0 0 "+WD+" "+H, width:WD, height:H, role:"img",
    "aria-label":"최근 12개월 실거래 분포 p10 "+eok(p.p10)+" 중위 "+eok(p.p50)
      +" p90 "+eok(p.p90)+(ask?", 입력 호가 "+eok(ask):"") });
  svg.appendChild(el("rect", { x:xOf(p.p10), y:26, width:xOf(p.p90)-xOf(p.p10), height:18,
    rx:6, class:"s-band" }));
  svg.appendChild(el("rect", { x:xOf(p.p25), y:26, width:xOf(p.p75)-xOf(p.p25), height:18,
    rx:5, class:"s-ring-est" }));
  svg.appendChild(el("line", { x1:xOf(p.p50), y1:22, x2:xOf(p.p50), y2:48, class:"s-mid" }));
  [["p10",p.p10],["중위",p.p50],["p90",p.p90]].forEach(t => {
    svg.appendChild(txt("text", { x:xOf(t[1]), y:60, class:"s-tick", "text-anchor":"middle" },
      t[0]+" "+eok(t[1])));
  });
  if (ask){
    svg.appendChild(el("line", { x1:xOf(ask), y1:14, x2:xOf(ask), y2:50, class:"s-ask" }));
    svg.appendChild(txt("text", { x:xOf(ask), y:11, class:"s-lab", "text-anchor":"middle",
      fill:"var(--danger-text)" }, "호가 "+eok(ask)));
  }
  return svg;
}

function axisList(c, dropTrend){

    if (a.clipped) badges.push(h("span", { class:"badge badge--warn", text:"눈금 밖(이상치)" }));
    ul.appendChild(h("li", {}, [

        (gr === "missing" && a.miss) ? h("p", { class:"axis-miss", text:a.miss }) : null,

          text:"관점 토글이 켜져 있어 총점에서 뺐습니다. 값 자체는 " + Math.round(a.score) + "점입니다." }) : null,

        (k === "trend" && a.score !== null && c.regionTrend !== null) ? h("p", { class:"axis-miss",
          text:"같은 시군구 12개월 " + pc(c.regionTrend) + " · 지역 대비 초과분 "

function altTable(c){

          + "<small>시군구 시장지수로 거래별 환산 후 중위. 끄면 미보정 원값입니다.</small>" }) ]));
      c2.appendChild(h("button", { class:"toggle", "aria-pressed":String(S.ghost),
        onclick:()=>{ S.ghost=!S.ghost; render(); } }, [
        h("span", { class:"box", text:S.ghost?"\u2713":"" }),
        h("span", { class:"t", html:"\u274C 대조군: 미보정 위치를 붉은 점선으로 겹쳐 보기"
          + "<small>같은 데이터인데 동 순서와 폭이 달라집니다 — 그 차이가 곧 시장 이동입니다.</small>" }) ]));
    }

    const rows = drawn.map(d => ({ label:d.d, n:d.n,
      ratio: useAdj ? d.adjR : d.rawR })).filter(r => r.ratio !== null);
    const ghost = (S.ghost && useAdj) ? drawn.map(d=>({ ratio:d.rawR })) : null;
    c2.appendChild(strip(rows, { kind:"dong", ghost,
      aria: c.name+" 동별 배율: "+rows.map(r=>r.label+" "+r.ratio.toFixed(3)+"배 "+r.n+"건").join(", ") }));

    const rr = rows.map(r=>r.ratio);
    const sp = Math.max.apply(null,rr)/Math.min.apply(null,rr);
    const spRaw = (function(){ const v = drawn.map(d=>d.rawR).filter(x=>x!==null);
      return v.length ? Math.max.apply(null,v)/Math.min.apply(null,v) : null; })();
    c2.appendChild(h("div", { class:"note", html:
      (sp >= 1.10 ? "<b>동을 따져야 합니다 — 최대 \u00D7"+sp.toFixed(3)+"</b>."
                  : "<b>동별 차이가 작습니다 — 최대 \u00D7"+sp.toFixed(3)+"</b>. 동보다 층을 보세요.")
      + (useAdj && spRaw ? " 미보정으로 재면 \u00D7"+spRaw.toFixed(3)+" 였습니다 — "
          + "<b>차이의 일부는 동이 아니라 계약 시점</b>이었습니다." : "") }));

    /* 표 대체본 */
    const t = h("table", { class:"alt" });
    t.appendChild(h("thead",{},[h("tr",{},[h("th",{text:"동"}),h("th",{text:"배율"}),
      h("th",{text:"미보정"}),h("th",{text:"표본"}),h("th",{text:"총 층수"})])]));
    const tbb = h("tbody");
    drawn.slice().sort((a,b)=>(useAdj?b.adjR-a.adjR:b.rawR-a.rawR)).forEach(d => {
      tbb.appendChild(h("tr",{},[ h("td",{text:d.d}),
        h("td",{class:"n",text:(useAdj?d.adjR:d.rawR)===null?"—":"\u00D7"+(useAdj?d.adjR:d.rawR).toFixed(3)}),
        h("td",{class:"n",text:d.rawR===null?"—":"\u00D7"+d.rawR.toFixed(3)}),
        h("td",{class:"n",text:d.n+"건"}),
        h("td",{class:"n",text:d.floors?d.floors+"층":"—"}) ]));
    });
    t.appendChild(tbb); c2.appendChild(t);
  }

  /* 그리지 않되 숨기지 않는다 */
  const notes = [];
  if (skipped.length) notes.push("표본 3건 미만이라 <b>그리지 않은 동</b>: "
    + skipped.map(d=>d.d+" "+d.n+"건").join(" · "));
  if (unknown) notes.push("실거래에 동 정보가 없는 건: <b>"+unknown.n+"건</b>"
    + " — 다른 동에 섞지 않고 따로 셉니다(전 DB 동 정보 보유율 84.2%).");
  if (notes.length) c2.appendChild(h("div", { class:"note",
    html: notes.join("<br>") + "<br>빼서 숨긴 것이 아니라 여기 적어 둡니다." }));
  wrap.appendChild(c2);

  /* ── 층대별 ── */
  const c3 = h("div", { class:"card" }, [
    h("h2", { text:"층대별 실거래 — 층 효과가 동 효과보다 크고, 더 안정적이다" }),
    h("p", { class:"sub", html:
      "운영 DB 실측에서 층 효과(중위 6.8%)가 동 효과(4.7%)보다 큽니다. "
      + "게다가 층대는 표본이 크고 시점이 고르게 섞여 있어 <b>시점 보정 전후가 거의 같습니다</b> — "
      + "동보다 <b>믿을 만한 신호</b>입니다." })
  ]);
  const frows = c.floors.map(f => ({ label:f.fb, n:f.n,
    ratio: useAdj ? f.adjR : f.rawR })).filter(r => r.ratio !== null);
  if (frows.length){
    c3.appendChild(strip(frows, { kind:"floor",
      aria:c.name+" 층대별 배율: "+frows.map(r=>r.label+" "+r.ratio.toFixed(3)+"배").join(", ") }));
  }

  /* 상대 층 위치 — building.floors 를 쓴다 */
  if (c.bfl){
    const withF = c.dongs.filter(d => d.floors && d.n >= 3 && d.d !== "(미상)");
    if (withF.length){
      if (S.dong === null) S.dong = withF[0].d;
      const cur = withF.find(d => d.d === S.dong) || withF[0];
      if (S.floor === null) S.floor = Math.max(1, Math.round(cur.floors * 0.5));
      const fl = Math.min(cur.floors, Math.max(1, Math.round(Number(S.floor) || 1)));
      /* 위에서 몇 번째인가. 최상층이 0% 가 되지 않도록 (floors-fl+1)/floors 로 센다. */
      const pctTop = Math.max(1, Math.round((cur.floors - fl + 1) / cur.floors * 100));
      const nameOf = p => p <= 20 ? "최상층권" : p <= 40 ? "상층" : p <= 60 ? "중간층"
        : p <= 80 ? "중하층" : "저층";
      const fb = fl <= 2 ? "1~2층" : fl <= 5 ? "3~5층" : fl <= 10 ? "6~10층"
        : fl <= 15 ? "11~15층" : "16층~";
      const fr = c.floors.find(f => f.fb === fb);
      c3.appendChild(h("h3", { text:"내 물건의 상대 층 위치" }));
      c3.appendChild(h("p", { class:"sub", html:
        "같은 12층이라도 총 15층이면 <b>최상층권</b>, 총 36층이면 <b>중하층</b>입니다. "
        + "<code>building.floors</code> 는 52,901동 <b>전부</b> 채워져 있어 실제로 아는 값입니다." }));
      c3.appendChild(h("label", { class:"fld" }, [
        h("span", { text:"동" }),
        (function(){ const s = h("select", { "aria-label":"동 선택",
            onchange:e=>{ S.dong = e.target.value; S.floor = null; render(); } },
            withF.map(d => { const o = h("option", { value:d.d,
              text:d.d + " (총 " + d.floors + "층 · " + d.n + "건)" });
              if (d.d === cur.d) o.setAttribute("selected",""); return o; })); return s; })(),
        h("span", { text:"층" }),
        h("input", { type:"number", min:"1", max:String(cur.floors), value:String(fl),
          "aria-label":"층 입력",
          oninput:e=>{ const v = parseInt(e.target.value, 10);
            S.floor = isNaN(v) ? 1 : Math.min(cur.floors, Math.max(1, v)); render(); } })
      ]));
      c3.appendChild(h("div", { class:"note", html:
        "<b>"+cur.d+" "+fl+"층 / 총 "+cur.floors+"층 = 상위 "+pctTop+"% ("+nameOf(pctTop)+")</b>"
        + (fr ? "<br>이 층대(" + fb + ") 실거래 배율 \u00D7"
            + ((useAdj && fr.adjR !== null ? fr.adjR : fr.rawR)).toFixed(3)
            + " · 표본 " + fr.n + "건" : "<br>이 층대는 표본이 없습니다.")
        + "<br>이 동의 실거래 층 범위 " + cur.minF + "~" + cur.maxF + "층." }));
    }
  }
  c3.appendChild(h("div", { class:"note", html:
    "표기는 <b>인과가 아니라 사실</b>입니다 — \"이 동이 좋아서 비싸다\"가 아니라 "
    + "<b>\"이 동의 실거래가 단지 중위보다 X% 높았다\"</b>. "
    + "타입·향·리모델링은 통제하지 못했습니다. <b>향 데이터는 DB에 0행입니다.</b>" }));
  wrap.appendChild(c3);

  /* ── 호가 타당성 ── */
  wrap.appendChild(askPanel(c, useAdj));
  return wrap;
}

function bandName(b){
  return ({"1_lt60":"60㎡ 미만","2_60_85":"60~85㎡","3_85_102":"85~102㎡",
           "4_102_135":"102~135㎡","5_gt135":"135㎡ 초과"})[b] || b;
}

/* 호가 타당성 — 실거래(과거)와 호가(현재)를 **섞지 않는다** */
function askPanel(c, useAdj){
  const sc = DB.scenarios.find(s => s.cid === c.id);
  const card = h("div", { class:"card" }, [
    h("h2", { text:"호가 타당성 — 실거래(과거) vs 호가(현재)" }),
    h("div", { class:"note bad", html:
      "⚠️ <b>DB의 호가(<code>listing</code>) 테이블은 0행입니다.</b> 아래는 "
      + "<b>사용자가 호가를 직접 입력했다고 가정한 시나리오</b>이며 실제 매물이 아닙니다.<br>"
      + "실거래는 <b>과거에 체결된 값</b>, 호가는 <b>현재 부르는 값</b>입니다 — "
      + "성격이 다른 숫자라 뺄셈 한 번으로 비교되지 않습니다. "
      + "신고기한 30일 + 수집 최신일 <span class=\"num\">"+M.tradeMax+"</span>." })
  ]);
  if (!sc){
    card.appendChild(h("div", { class:"note", html:
      "이 단지에는 시나리오를 넣지 않았습니다. 호가 패널은 <b>같은 동·같은 층대 셀의 실거래를 "
      + "직접 뽑아야</b> 정확합니다 — 단지 중위에 동 배율·층 배율을 곱한 <b>모델 추정치로 "
      + "대체하지 않습니다.</b> 시나리오는 파크리오(보정 가능)와 태봉마을(보정 불가) 두 곳입니다." }));
    return card;
  }
  const p = c.price;
  const lad = h("ul", { class:"lad" });
  lad.appendChild(h("li", { class:"top" }, [
    h("span", { class:"k", text:"내가 입력한 호가 · "+sc.dong+" "+sc.floor+"층 "+sc.area+"㎡ · "
      + sc.facing+" (입력값)" }),
    h("span", { class:"v", text:eok(sc.ask) })
  ]));
  lad.appendChild(h("li", {}, [
    h("span", { class:"k", text:"├ 같은 동·층대("+sc.dong+" "+sc.fb+") 실거래 중위 · 미보정 "
      + (sc.n ? sc.n+"건 / 24개월" : "표본 없음") }),
    h("span", { class:"v", text: sc.rawMed !== null ? eok(sc.rawMed) : "—" })
  ]));
  if (sc.adjustable && sc.adjMed !== null){
    const shift = (sc.adjMed/sc.rawMed - 1) * 100;
    lad.appendChild(h("li", {}, [
      h("span", { class:"k", text:"├ 시점 보정 (시군구 시장지수 → 기준월 "+sc.refYm+")" }),
      h("span", { class:"v", text:pc(shift) })
    ]));
    lad.appendChild(h("li", {}, [
      h("span", { class:"k", text:"├ 보정 후 실질 (그 셀 거래를 "+sc.refYm+" 수준으로 환산)" }),
      h("span", { class:"v", text:eok(sc.adjMed) })
    ]));
    lad.appendChild(h("li", {}, [
      h("span", { class:"k", text:"├ 호가 − 보정 후 실질" }),
      h("span", { class:"v", text:pc((sc.ask/sc.adjMed - 1) * 100) })
    ]));
  } else {
    lad.appendChild(h("li", { class:"miss" }, [
      h("span", { class:"k", text:"├ 시점 보정" }),
      h("span", { class:"v", text:"보정 불가 — 지역 시장지수 표본 부족" })
    ]));
  }
  const base = (sc.adjustable && sc.adjMed !== null) ? sc.adjMed : sc.rawMed;
  const pos = sc.ask < p.p10 ? "p10 아래 — 같은 면적대에서 드물게 싼 구간"
    : sc.ask <= p.p25 ? "p10~p25 구간"
    : sc.ask <= p.p50 ? "p25~중위 구간"
    : sc.ask <= p.p75 ? "중위~p75 구간"
    : sc.ask <= p.p90 ? "p75~p90 구간 · 비싸지만 이상치는 아님"
    : "p90 위 — 최근 12개월 실거래 상위 10% 밖";
  lad.appendChild(h("li", {}, [
    h("span", { class:"k", text:"└ 단지 "+p.area+"㎡ 최근 12개월 분포("+p.n+"건) 안의 위치" }),
    h("span", { class:"v", text:pos })
  ]));
  card.appendChild(lad);
  card.appendChild(bandBar(p, sc.ask));

  if (sc.trades && sc.trades.length){
    card.appendChild(h("h3", { text:"그 셀의 실거래 "+sc.trades.length+"건 (숨기지 않고 전부)" }));
    const t = h("table", { class:"alt" });
    t.appendChild(h("thead",{},[h("tr",{},[h("th",{text:"계약일"}),h("th",{text:"층"}),
      h("th",{text:"면적"}),h("th",{text:"실거래가"}),h("th",{text:sc.refYm+" 환산"})])]));
    const tb = h("tbody");
    sc.trades.forEach(x => tb.appendChild(h("tr",{},[
      h("td",{text:x.date}), h("td",{class:"n",text:x.floor+"층"}),
      h("td",{class:"n",text:x.area+"㎡"}), h("td",{class:"n",text:eok(x.price)}),
      h("td",{class:"n",text:x.adj?eok(x.adj):"—"}) ])));
    t.appendChild(tb); card.appendChild(t);
    const last = sc.trades[sc.trades.length-1];
    card.appendChild(h("div", { class:"note warn", text:
      "이 셀의 가장 최근 실거래는 "+last.date+" · "+eok(last.price)+" 입니다. "
      + "그 뒤로 거래가 없었다는 뜻이지 가격이 그대로라는 뜻이 아닙니다." }));
  }
  card.appendChild(h("div", { class:"note bad", html:
    "⚠️ <b>향(向)으로 가격을 보정하지 않았습니다.</b> <code>building.direction_deg</code> 0행 · "
    + "<code>building.geom</code> 0행이라 배치도로 방위를 추정할 길도 없습니다. "
    + "위의 \""+sc.facing+"\"은 <b>사용자가 적어 넣은 값</b>이며 검증되지 않았습니다." }));
  return card;
}

function render(){
  const m = document.getElementById("main");
  m.innerHTML = "";
  m.appendChild(S.view === "list" ? viewList() : viewDetail());
}
render();
</script>
</body>
</html>
