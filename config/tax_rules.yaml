# tax_rules.yaml — 세율·대출한도 설정 (검증본)
#
# ✅ status: verified — 아래 값은 공식 출처에서 확인해 채웠습니다(2026-07-25 확인).
#    re-data 가 지방세법·공인중개사법 시행규칙·금융위 자료로 대조했습니다.
#
# ⚠️ 세제·대출 규제는 자주 바뀝니다. 이 파일의 as_of(확인일)가 오래되면 로더가
#    갱신 경고를 냅니다(STALE_AFTER_DAYS=180). 재확인 후 as_of 를 갱신하세요.
#
# 퍼센트 규약 (engine/loader 와 동일)
# -----------------------------------
# 모든 rate_pct 와 extras.*_pct 는 **거래금액 대비 %** 입니다.
#   취득세 본세 rate_pct + 지방교육세 + 농특세 = 실효 취득 세율. (예: 1.0 + 0.1 + 0.0 = 1.1%)
# ⚠️ 지방교육세는 두 방식이 있다:
#   · 고정요율 구간: extras.local_education_pct (거래금액 대비 %, 예 0.1)
#   · 누진 밴드:     extras_ratio.local_education_ratio (본세율 대비 배율, 예 0.1 → 본세×1/10)
#   누진 밴드에서 지교를 extras 에 고정으로 적으면 본세가 변할 때 틀린다(계약서 §2.3).
#
# ─────────────────────────────────────────────────────────────────────────
# ⚑ 알려진 한계 — 상태 갱신 (ORDER 2026-07-25-15-data · 계약서 docs/domain/lending-rules-contract.md)
# ─────────────────────────────────────────────────────────────────────────
# L1. 6~9억 취득세 누진 산식(세율% = 취득가액(억)×2/3 − 3).
#     ✅ 데이터: 0.5억 서브밴드 → progressive 밴드(std_6_9_*)로 교체.
#     ✅ 엔진 적용됨: engine 이 bracket.total_rate_pct 로 전환(계약서 §3.3)해 6~9억이
#        가격별로 정확히 계산된다(근사 아님). rate_pct(2.2)는 산식 미적용 폴백일 뿐 미사용.
#        → L1 종결. §4 검산표(6.5억 1.4667%·7.5억 2.2%·8.5억 2.9333%)와 정확 일치.
# L2. 대출규제.
#     ✅ 데이터: 수도권 6억 절대한도(lending.absolute_cap)·스트레스 DSR 가산금리
#        (lending.stress_dsr)를 6.27 대책·스트레스DSR 3단계 출처로 채움.
#     ✅ 엔진 적용됨: engine 이 absolute_cap/stress 를 조회하고 region_group(계약서 §1,
#        법정동코드 앞2자리·기본값 수도권)을 공급한다. 6억캡이 binding 이면 UI 에 노출.
#     ⏳ 잔여: 단일 ltv/dsr/dti 대표값(무주택·실거주·비규제)은 규제지역·다주택·생애최초
#        차등 여전히 미반영. 6억캡·스트레스의 생애최초/대출유형 예외도 미반영(재확인 대상).
# L3. 조정 일시적 2주택 특례, 지방 저가주택(공시 2억↓) 중과배제, 생애최초 취득세 감면 등
#     감면·특례는 미반영. 보수적으로 표준세율을 적용(세금을 낮게 잡지 않음).
# ─────────────────────────────────────────────────────────────────────────

version: "2026-07-25"
status: verified

# ==========================================================================
# 취득세 (지방세법 §11 주택 유상거래 / §13의2 다주택 중과)
#   지방교육세 = 취득세율 × 1/10   (지방세법 §151)
#   농어촌특별세 = 전용 85㎡ 초과분만 0.2%, 85㎡ 이하(국민주택규모) 비과세 (농특세법)
#   위에서부터 먼저 매칭되는 구간 적용 — 순서 중요.
#   when 접미사: _max=이하, _min=이상, 그 외=완전일치. 없는 사실은 매칭 실패(추정 안 함).
#   facts: houses_owned(취득 후 주택수) · price(원) · area(전용 ㎡) · regulated(조정대상지역 bool)
# ==========================================================================
acquisition_tax:

  # ── 조정대상지역 다주택 중과 (§13의2) ────────────────────────────────
  - id: adj_3plus_small          # 조정 3주택 이상 · 85㎡ 이하
    when: { regulated: true, houses_owned_min: 3, area_max: 85 }
    rate_pct: 12.0
    extras: { local_education_pct: 0.4, rural_special_pct: 0.0 }
    source: "지방세법 §13의2 (다주택 중과 12%) · 조정대상지역 3주택↑, 2020.8.12 시행체계"
    source_url: "https://www.law.go.kr/법령/지방세법/제13조의2"
    as_of: "2026-07-25"
  - id: adj_3plus_large          # 조정 3주택 이상 · 85㎡ 초과 (농특세 1.0%)
    when: { regulated: true, houses_owned_min: 3 }
    rate_pct: 12.0
    extras: { local_education_pct: 0.4, rural_special_pct: 1.0 }
    source: "지방세법 §13의2 + 농특세법 (85㎡ 초과 농특세 1.0%)"
    source_url: "https://www.law.go.kr/법령/지방세법/제13조의2"
    as_of: "2026-07-25"
  - id: adj_2_small              # 조정 2주택 · 85㎡ 이하
    when: { regulated: true, houses_owned_min: 2, area_max: 85 }
    rate_pct: 8.0
    extras: { local_education_pct: 0.4, rural_special_pct: 0.0 }
    source: "지방세법 §13의2 (조정대상지역 2주택 8%)"
    source_url: "https://www.law.go.kr/법령/지방세법/제13조의2"
    as_of: "2026-07-25"
  - id: adj_2_large              # 조정 2주택 · 85㎡ 초과 (농특세 0.6%)
    when: { regulated: true, houses_owned_min: 2 }
    rate_pct: 8.0
    extras: { local_education_pct: 0.4, rural_special_pct: 0.6 }
    source: "지방세법 §13의2 + 농특세법 (85㎡ 초과 농특세 0.6%)"
    source_url: "https://www.law.go.kr/법령/지방세법/제13조의2"
    as_of: "2026-07-25"

  # ── 비조정지역 다주택 중과 (§13의2) ──────────────────────────────────
  - id: nonadj_4plus_small       # 비조정 4주택 이상 · 85㎡ 이하
    when: { houses_owned_min: 4, area_max: 85 }
    rate_pct: 12.0
    extras: { local_education_pct: 0.4, rural_special_pct: 0.0 }
    source: "지방세법 §13의2 (비조정 4주택↑ 12%)"
    source_url: "https://www.law.go.kr/법령/지방세법/제13조의2"
    as_of: "2026-07-25"
  - id: nonadj_4plus_large       # 비조정 4주택 이상 · 85㎡ 초과
    when: { houses_owned_min: 4 }
    rate_pct: 12.0
    extras: { local_education_pct: 0.4, rural_special_pct: 1.0 }
    source: "지방세법 §13의2 + 농특세법"
    source_url: "https://www.law.go.kr/법령/지방세법/제13조의2"
    as_of: "2026-07-25"
  - id: nonadj_3_small           # 비조정 3주택 · 85㎡ 이하
    when: { houses_owned_min: 3, area_max: 85 }
    rate_pct: 8.0
    extras: { local_education_pct: 0.4, rural_special_pct: 0.0 }
    source: "지방세법 §13의2 (비조정 3주택 8%)"
    source_url: "https://www.law.go.kr/법령/지방세법/제13조의2"
    as_of: "2026-07-25"
  - id: nonadj_3_large           # 비조정 3주택 · 85㎡ 초과
    when: { houses_owned_min: 3 }
    rate_pct: 8.0
    extras: { local_education_pct: 0.4, rural_special_pct: 0.6 }
    source: "지방세법 §13의2 + 농특세법"
    source_url: "https://www.law.go.kr/법령/지방세법/제13조의2"
    as_of: "2026-07-25"

  # ── 일반세율: 무주택→1주택 취득, 또는 비조정 2주택 (§11) ──────────────
  #    houses_owned_max: 2 로 1주택·비조정2주택을 함께 처리. 조정 2주택은 위에서 이미 매칭됨.
  #    [85㎡ 이하 그룹 — 농특세 비과세]
  - id: std_le6_small            # 6억 이하 · 85㎡ 이하 → 1.1%
    when: { houses_owned_max: 2, price_max: 600000000, area_max: 85 }
    rate_pct: 1.0
    extras: { local_education_pct: 0.1, rural_special_pct: 0.0 }
    source: "지방세법 §11①8 (6억 이하 1%) + §151 지방교육세 0.1%"
    source_url: "https://www.law.go.kr/법령/지방세법/제11조"
    as_of: "2026-07-25"
  # 6~9억 누진 밴드 (L1·계약서 §2.3): 세율% = 취득가액(억)×2/3 − 3, 지교 = 본세×1/10.
  #   서브밴드 6개를 이 하나로 대체. 엔진이 total_rate_pct 를 쓰면 연속·정확(근사 아님).
  #   rate_pct 는 폴백(밴드중앙 7.5억 결합값 = 본세2.0 + 지교0.2 = 2.2). 엔진이 아직
  #   _pct_total 을 쓰는 전환기에만 쓰인다(계약서 §3.3). 지교는 extras 가 아니라 extras_ratio.
  - id: std_6_9_small            # 6억 초과~9억 이하 · 85㎡ 이하
    when: { houses_owned_max: 2, price_min: 600000001, price_max: 900000000, area_max: 85 }
    rate_pct: 2.2                 # 폴백 대표값. 산식(progressive) 적용 시 미사용.
    progressive:
      basis: price
      unit_krw: 100000000        # '억' 단위 환산
      coefficient: 0.6666666666666666   # × 2/3
      constant: -3.0             # − 3
      min_rate_pct: 1.0          # 클램프(6억 경계) — 필수
      max_rate_pct: 3.0          # 클램프(9억 경계) — 필수
    extras_ratio:
      local_education_ratio: 0.1 # 지방교육세 = 본세율 × 1/10 (지방세법 §151, 본세 연동)
    extras:
      rural_special_pct: 0.0     # 85㎡ 이하 농특세 비과세
    source: "지방세법 §11①8 (6~9억 누진산식 가액×2/3−3) + §151 지방교육세(본세×1/10)"
    source_url: "https://www.law.go.kr/법령/지방세법/제11조"
    as_of: "2026-07-25"
  - id: std_over9_small          # 9억 초과 · 85㎡ 이하 → 3.3%
    when: { houses_owned_max: 2, area_max: 85 }
    rate_pct: 3.0
    extras: { local_education_pct: 0.3, rural_special_pct: 0.0 }
    source: "지방세법 §11①8 (9억 초과 3%) + §151 지방교육세 0.3%"
    source_url: "https://www.law.go.kr/법령/지방세법/제11조"
    as_of: "2026-07-25"

  #    [85㎡ 초과 그룹 — 농특세 0.2% 가산]
  - id: std_le6_large            # 6억 이하 · 85㎡ 초과 → 1.3%
    when: { houses_owned_max: 2, price_max: 600000000 }
    rate_pct: 1.0
    extras: { local_education_pct: 0.1, rural_special_pct: 0.2 }
    source: "지방세법 §11①8 (6억↓ 1%) + 지교 0.1% + 농특 0.2%(85㎡초과)"
    source_url: "https://www.law.go.kr/법령/지방세법/제11조"
    as_of: "2026-07-25"
  - id: std_6_9_large           # 6억 초과~9억 이하 · 85㎡ 초과 (농특세 0.2% 가산)
    when: { houses_owned_max: 2, price_min: 600000001, price_max: 900000000 }
    rate_pct: 2.2                # 폴백(밴드중앙 본세2.0+지교0.2). 농특 0.2 는 extras 로 별도 가산.
    progressive:
      basis: price
      unit_krw: 100000000
      coefficient: 0.6666666666666666
      constant: -3.0
      min_rate_pct: 1.0
      max_rate_pct: 3.0
    extras_ratio:
      local_education_ratio: 0.1
    extras:
      rural_special_pct: 0.2     # 85㎡ 초과 농특세 0.2% (금액 대비 고정)
    source: "지방세법 §11①8 (6~9억 누진산식) + §151 지방교육세 + 농특세 0.2%(85㎡초과)"
    source_url: "https://www.law.go.kr/법령/지방세법/제11조"
    as_of: "2026-07-25"
  - id: std_over9_large          # 9억 초과 · 85㎡ 초과 → 3.5%
    when: { houses_owned_max: 2 }
    rate_pct: 3.0
    extras: { local_education_pct: 0.3, rural_special_pct: 0.2 }
    source: "지방세법 §11①8 (9억↑ 3%) + 지교 0.3% + 농특 0.2%(85㎡초과)"
    source_url: "https://www.law.go.kr/법령/지방세법/제11조"
    as_of: "2026-07-25"

  # ── 최종 안전망: 위 어느 구간도 안 맞으면(예: 취득후 주택수 미상) 보수적 중과 ──
  #    로더는 매칭 실패 시 예외를 던지지만, 다주택 상한(12.4%)을 명시적 fallback 로 둬
  #    '세금을 낮게 잡는' 실수를 원천 차단한다(높게 잡히면 예산이 보수적으로 나옴).
  - id: fallback_conservative
    when: {}
    rate_pct: 12.0
    extras: { local_education_pct: 0.4, rural_special_pct: 0.0 }
    source: "안전망: 구간 미상 시 다주택 상한(12.4%) 적용 — 실제 세율은 더 낮을 수 있음, 재확인 필요"
    source_url: "https://www.law.go.kr/법령/지방세법/제13조의2"
    as_of: "2026-07-25"

# ==========================================================================
# 중개보수 (공인중개사법 시행규칙 §20 별표1 · 주택 매매 상한요율)
#   실제 보수는 상한요율 이내에서 협의. 여기서는 '상한'(최대비용)을 써서 예산을 보수적으로 잡음.
#   5천만↓·5천~2억 구간만 한도액(cap) 존재. 2억 이상은 한도액 없음.
#   지자체 조례로 세부는 달라질 수 있음(수도권 표준 기준).
# ==========================================================================
brokerage_fee:
  - id: brk_under_50m            # 5천만원 미만 0.6% (한도 25만)
    when: { price_max: 49999999 }
    rate_pct: 0.6
    extras: { cap_krw: 250000 }
    source: "공인중개사법 시행규칙 §20 별표1 (5천만↓ 0.6%, 한도 25만원)"
    source_url: "https://www.law.go.kr/법령/공인중개사법 시행규칙"
    as_of: "2026-07-25"
  - id: brk_50m_200m             # 5천만~2억 미만 0.5% (한도 80만)
    when: { price_max: 199999999 }
    rate_pct: 0.5
    extras: { cap_krw: 800000 }
    source: "공인중개사법 시행규칙 §20 별표1 (5천만~2억 0.5%, 한도 80만원)"
    source_url: "https://www.law.go.kr/법령/공인중개사법 시행규칙"
    as_of: "2026-07-25"
  - id: brk_200m_900m            # 2억~9억 미만 0.4% (한도 없음)
    when: { price_max: 899999999 }
    rate_pct: 0.4
    source: "공인중개사법 시행규칙 §20 별표1 (2억~9억 0.4%)"
    source_url: "https://www.law.go.kr/법령/공인중개사법 시행규칙"
    as_of: "2026-07-25"
  - id: brk_900m_1200m           # 9억~12억 미만 0.5%
    when: { price_max: 1199999999 }
    rate_pct: 0.5
    source: "공인중개사법 시행규칙 §20 별표1 (9억~12억 0.5%)"
    source_url: "https://www.law.go.kr/법령/공인중개사법 시행규칙"
    as_of: "2026-07-25"
  - id: brk_1200m_1500m          # 12억~15억 미만 0.6%
    when: { price_max: 1499999999 }
    rate_pct: 0.6
    source: "공인중개사법 시행규칙 §20 별표1 (12억~15억 0.6%)"
    source_url: "https://www.law.go.kr/법령/공인중개사법 시행규칙"
    as_of: "2026-07-25"
  - id: brk_over_1500m           # 15억 이상 0.7%
    when: {}
    rate_pct: 0.7
    source: "공인중개사법 시행규칙 §20 별표1 (15억↑ 0.7%)"
    source_url: "https://www.law.go.kr/법령/공인중개사법 시행규칙"
    as_of: "2026-07-25"

# ==========================================================================
# 대출 규제 (L2 참조)
#   ltv/dsr/dti: '무주택·실거주·비규제' 기준 대표값(규제지역·다주택 차등 미반영, 여전히 단일값).
#   absolute_cap/stress_dsr: 6.27 대책·스트레스DSR 을 데이터로 표현(신규). 단 engine 이 아직
#     조회하지 않고 region_group fact 도 미공급이라 현재 계산은 불변 — 하위호환(계약서 §1·§3).
# ==========================================================================
lending:
  ltv:
    rate_pct: 70.0              # 비규제지역·무주택 실거주 기준. 규제지역은 40%로 별도 필요.
    source: "금융위 6.27 대책(2025) 및 은행업감독규정 — 비규제 무주택 실거주 LTV 70% 기준"
    source_url: "https://www.fsc.go.kr/no010101/84824"
    as_of: "2026-07-25"
  dsr:
    rate_pct: 40.0             # 은행권 차주단위 DSR 40%. 스트레스 가산은 아래 stress_dsr 로 표현.
    source: "금융위 차주단위 DSR(은행권 40%)"
    source_url: "https://www.fsc.go.kr/no010101/84824"
    as_of: "2026-07-25"
  dti:
    rate_pct: 60.0             # 적용 지역만. DSR 도입 후 실효성 낮음 — 참고용 상한.
    source: "금융위 DTI 60%(적용지역 한정) — 통상 DSR 이 실질 한도를 결정"
    source_url: "https://www.fsc.go.kr/no010101/84824"
    as_of: "2026-07-25"

  # ── 대출 절대한도 (요율과 무관하게 대출금 상한) — 6.27 대책 2025 ──
  #    여러 개가 맞으면 로더가 '가장 작은 것'을 적용. region_group 은 engine 이 공급(계약서 §1).
  #    ⚠️ 생애최초·중도금·디딤돌 등 예외는 미반영 — 확인되면 when 을 나눠 규칙 추가.
  absolute_cap:
    - id: cap_capital_600m
      when: { region_group: "수도권" }
      absolute_cap_krw: 600000000    # 수도권 주택구입 목적 주담대 6억원 한도
      source: "금융위 가계부채 관리 강화방안(6.27 대책, 2025.6.27) — 수도권·규제지역 주담대 6억 한도(2025.6.28 시행)"
      source_url: "https://www.fsc.go.kr/no010101/84824"
      as_of: "2026-07-25"

  # ── 스트레스 DSR 가산금리(%p) — 한도 산정 금리에만 더한다(실상환액 아님, 계약서 §3.2) ──
  #    겹치면 로더가 '가장 높은 것' 적용. 변동/혼합/주기형 대출유형별 차등은 미반영(대표값).
  stress_dsr:
    - id: stress_capital
      when: { region_group: "수도권" }
      stress_rate_pct: 1.5           # 스트레스 DSR 3단계 수도권 주담대 가산
      source: "금융위 스트레스 DSR 3단계(2025.7 시행) — 수도권 주담대 스트레스금리 1.5%p"
      source_url: "https://www.fsc.go.kr/no010101/84824"
      as_of: "2026-07-25"
    - id: stress_non_capital
      when: { region_group: "비수도권" }
      stress_rate_pct: 0.75          # 비수도권 가산(수도권의 1/2)
      source: "금융위 스트레스 DSR 3단계(2025.7 시행) — 비수도권 주담대 스트레스금리 0.75%p"
      source_url: "https://www.fsc.go.kr/no010101/84824"
      as_of: "2026-07-25"

# ==========================================================================
# 정액 비용 (원) — 추정치. 사용자가 조정 가능. 세금이 아님.
# ==========================================================================
fixed_costs:
  registration_krw: 1500000    # 소유권이전등기 신청수수료 + 법무사 대행보수 추정(누진 구간 평균)
  moving_reserve_krw: 20000000 # 이사·수리 예비비 — 가용현금에서 차감(사용자 조정 가능)
  source: "등기신청수수료 + 대한법무사협회 보수기준(누진) 기반 추정 · 예비비는 사용자 기본값"
  source_url: "https://www.easylaw.go.kr/CSP/CnpClsMain.laf?csmSeq=649&ccfNo=4&cciNo=3&cnpClsNo=2"
  as_of: "2026-07-25"
