# sources.yaml — 데이터 소스 레지스트리 (수집 우선순위·주기·rate limit)
#
# 소유: re-data. 근거: team/roles/re-data.md(소스 우선순위표) · docs/02-design/security.md §1
#       · CHARTER §2·§4(G4 수집 합법성).
#
# 원칙 (G4 게이트)
# ----------------
# 1. 공공 오픈API 가 항상 1순위. 포털(호가) 수집은 공공API로 대체 불가능한 항목에만.
# 2. robots.txt·이용약관 준수. rate limit 필수. User-Agent 명시. 개인 비상업 용도.
# 3. 공공API만으로도 서비스가 성립하도록 이중화 — 포털이 막혀도 제품이 죽지 않아야 한다.
# 4. 판단이 서지 않으면 수집하지 말고 PM 에 에스컬레이션(enabled:false + requires_review:true).
#
# ⚠️ API 키는 여기 넣지 않는다. auth.env 로 .env 의 환경변수명만 가리킨다(CHARTER §5).
# ⚠️ enabled:false 소스의 endpoint 는 발급/확인 전이므로 TBD 로 둔다(엔드포인트 단정 금지).

version: "2026-07-25"

defaults:
  # 개인·비상업 식별. 연락처는 배포 시 .env 로 주입.
  user_agent: "pjt13-realestate/0.1 (personal, non-commercial)"
  rate_limit: { min_interval_sec: 1.0, jitter_sec: 0.5 }   # 요청 간 최소 간격 + 지터
  backoff: { attempts: 5, base_sec: 1.0, cap_sec: 60.0 }    # 지수 백오프 상한
  timeout_sec: 20

sources:
  # ── 1순위: 국토부 실거래가 (무료·합법·안정) — 이 하나만으로 서비스 성립 ──
  - id: molit_apt_trade
    priority: 1
    enabled: true
    legal: public_open_api
    provider: "공공데이터포털 — 국토교통부_아파트 매매 실거래가"
    endpoint: "https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade"  # 운영(실측 검증 2026-07-25). Dev 는 발급키로 403
    method: GET
    auth: { type: service_key, env: MOLIT_API_KEY }   # 사람이 발급(아래 B. 발급절차)
    params_builder: "app.ingest.molit:build_params"
    parser: "app.ingest.molit:parse_response"
    normalizer: "app.ingest.normalize"                 # MolitTrade → complex/unit_type/trade 키
    loader: "app.ingest.loader:PostgisTradeLoader"     # get-or-create·자연키 dedup 적재
    runner: "app.ingest.run_molit:run_daily"           # 실행 진입점(키 오면 이걸 호출)
    target_table: trade                                # + complex, unit_type 파생 적재
    cadence: daily            # 일 1회 야간 배치
    # 신고지연 최대 30일 → 최근 2개월(당월+전월) 재수집으로 지연분 흡수(자연키 dedup 으로 멱등)
    incremental: { by: month, lookback_months: 1 }
    rate_limit: { min_interval_sec: 0.5, jitter_sec: 0.3 }
    notes: >
      동(棟) 정보 없음(erd.md §0). 호가(listing)와 절대 혼합 금지.
      단지 좌표는 MOLIT 에 없음 → 적재 후 app.ingest.geocode(카카오 키워드검색)로 별도 enrich.
      region_code(10자리 법정동코드)는 region 마스터+resolver 필요, 없으면 NULL 로 둠.
      엔드포인트 경로는 서비스키 발급 시 상세페이지에서 최종 확인.

  # ── 단지 좌표 확보(지오코딩) — 적재 후 별도 단계 ──
  - id: kakao_geocode
    priority: 1
    enabled: false                 # KAKAO_REST_API_KEY 사람 발급 대기
    legal: portal_api_personal     # 카카오 로컬 API, 개인·비상업 쿼터
    provider: "카카오 로컬 키워드 검색 (단지명→WGS84 좌표)"
    endpoint: "https://dapi.kakao.com/v2/local/search/keyword.json"
    auth: { type: rest_api_key, env: KAKAO_REST_API_KEY }
    runner: "app.ingest.geocode:enrich_postgis_geom"
    target_table: complex          # complex.geom 채움(POINT,4326)
    cadence: on_demand             # 좌표 없는 단지 발생 시
    rate_limit: { min_interval_sec: 0.3, jitter_sec: 0.2 }
    notes: >
      x=경도(lon)·y=위도(lat) 순서 주의. 못 찾으면 추정 말고 NULL 유지(입지 분석은 '정보 없음').
      대안: 건축물대장 좌표(2차)·도로명주소 API(폴백).

  # ── 2순위: 공공 기초자료 (입지·가치 근거). 발급/확인 전이라 스캐폴드 상태 ──
  - id: molit_apt_price_public      # 공동주택 공시가격
    priority: 2
    enabled: false
    legal: public_open_api
    provider: "공공데이터포털/부동산공시가격알리미 — 공동주택 공시가격"
    endpoint: TBD
    auth: { type: service_key, env: MOLIT_API_KEY }
    target_table: complex          # 공시가격은 단지/타입 속성으로 적재(스키마 협의 필요)
    cadence: weekly
    notes: "종부세·재산세 시뮬레이션 근거. 적재 위치는 re-arch 와 스키마 협의."

  - id: building_ledger             # 건축물대장 (동 좌표·층·향)
    priority: 2
    enabled: false
    legal: public_open_api
    provider: "공공데이터포털 — 건축물대장 표제부/총괄표제부"
    endpoint: TBD
    auth: { type: service_key, env: MOLIT_API_KEY }
    target_table: building
    cadence: weekly
    notes: >
      erd.md Q3(동 좌표 확보) 후보 1순위. 동별 가치 추정의 근거.
      대장에 동별 좌표가 없으면 지도 API 지오코딩으로 보완(재조사 필요).

  - id: school_info                 # 학교 기본정보 (학군)
    priority: 2
    enabled: true
    legal: public_open_api
    provider: "교육부 NEIS 교육정보 개방 포털 — 학교기본정보(schoolInfo)"
    endpoint: "https://open.neis.go.kr/hub/schoolInfo"
    auth: { type: none }            # 인증키 없이 조회 가능(실측 2026-07-26)
    parser: "app.ingest.poi:parse_neis_schools"
    loader: "app.ingest.poi_loader:PostgisPoiLoader"
    runner: "scripts/load_poi.py --dataset school --geocode"
    target_table: poi               # category=school
    cadence: weekly
    rate_limit: { min_interval_sec: 0.5, jitter_sec: 0.2 }
    notes: >
      수도권 3개 시도교육청(B10 서울·J10 경기·E10 인천) × 초·중·고 = 4,462교(실측).
      ⚠️ **좌표가 없다** — 도로명주소만 준다. 카카오 주소검색으로 지오코딩하며
      동 중심점(REGION)은 채택하지 않는다(geocode.ADDRESS_TYPES_OK).
      ⚠️ 학구도(school_district)가 없으면 이 좌표는 입지 점수에 쓰이지 않는다 —
      도메인이 배정을 거리로 대체하지 않기 때문(analysis.assess_school).
      학업성취도는 이 API 에 없다. 출처·기준연도 없이 넣지 않는다(G2).

  # ── 입지 POI·도로·신설노선 (OSM) ──
  # ⚠️ 공공데이터포털의 해당 API들(전국도시철도역사·대규모점포·병원·도시공원)은
  #    **API별 활용신청이 사람 단계**라 현재 키로 403 이다(실측 2026-07-26:
  #    B551182 병원정보·B552657 응급의료 모두 403, MOLIT 실거래만 200).
  #    승인되면 이쪽을 1순위로 되돌리고 OSM 은 보완재로 내린다.
  - id: osm_poi
    priority: 2
    enabled: true
    legal: open_data_odbl          # 크롤링 아님 — 공개 API
    provider: "OpenStreetMap / Overpass API"
    endpoint: "https://overpass.kumi.systems/api/interpreter"
    auth: { type: none }
    parser: "app.ingest.poi"
    loader: "app.ingest.poi_loader:PostgisPoiLoader"
    runner: "scripts/fetch_poi.py → scripts/load_poi.py"
    target_table: poi               # subway / mart / park / hospital / hazard
    cadence: weekly
    rate_limit: { min_interval_sec: 5.0, jitter_sec: 1.0 }   # 무료 공용 인스턴스
    license:
      name: "ODbL 1.0"
      attribution: "© OpenStreetMap contributors"
      # ⚠️ 파생 DB 를 **공개 배포**하면 동일 라이선스로 공개할 의무가 생긴다(share-alike).
      #    개인 비상업 사용에는 제약이 없으나, 서비스를 외부 공개할 때 재검토 대상이다.
      share_alike_review_required: true
    notes: >
      실측 수도권 건수(2026-07-26): 역 786(여객 기준), 마트 3,763, 공원 8,213,
      병원 2,245, 유해요소 후보 12,398, 간선도로 24,638, 공사중·계획 철도 221.
      ⚠️ 노선(attrs.lines)은 역 노드가 아니라 정차지점(stop_position)에 붙어 있어
      좌표·이름으로 이어야 한다(poi.assign_lines). ID 직접 매칭은 0건이다.
      ⚠️ 태그 품질 편차 있음 — 성형외과가 amenity=hospital 로 붙는 사례 확인.
      응급실 여부는 emergency 태그가 없으면 '모름'으로 두고 없음으로 단정하지 않는다.

  - id: osm_road_transit
    priority: 2
    enabled: true
    legal: open_data_odbl
    provider: "OpenStreetMap / Overpass API — 간선도로 선형·신설노선"
    endpoint: "https://overpass.kumi.systems/api/interpreter"
    auth: { type: none }
    parser: "app.ingest.poi:parse_roads / parse_transit_plans"
    target_table: road_segment      # + transit_plan
    cadence: monthly
    rate_limit: { min_interval_sec: 5.0, jitter_sec: 1.0 }
    notes: >
      motorway→고속도로 · trunk→자동차전용 · primary→간선 만 적재한다.
      보조간선·이면도로까지 넣으면 모든 단지가 '대로 횡단'이 되어 판정이 무의미해진다.
      ⚠️ 현재 road_segment 는 **소비처가 둘 다 비어 있어 효과가 없다**:
         (1) 통학로 횡단 판정은 school_district 필요(0행)
         (2) 동별 간선도로 거리는 building.geom 필요(52,901행 중 좌표 0행)
      두 선행조건 중 하나가 채워질 때 적재하는 것이 순서상 맞다.

  # ── 3순위: 시장 지표 (타이밍 근거) ──
  - id: reb_market_index            # 부동산원 전세가율·미분양·매수우위지수
    priority: 3
    enabled: false
    legal: public_open_api
    provider: "한국부동산원 R-ONE / 공공데이터포털 — 부동산 통계"
    endpoint: TBD
    auth: { type: service_key, env: MOLIT_API_KEY }
    target_table: market_index
    cadence: weekly

  # ── 4순위: 정책·고시 문서 (정책 에이전트 입력) ──
  - id: policy_docs
    priority: 4
    enabled: false
    legal: public_document
    provider: "국토부 보도자료 · 지자체 정비사업 고시"
    endpoint: TBD
    target_table: policy
    cadence: weekly
    notes: "모든 정책 레코드는 source_url·effective_from 필수(G2). 출처 없는 정책 금지."

  # ── 5순위: 포털 호가 (⚠️ G4 — 공공API로 대체 불가한 '현재 호가'에만) ──
  - id: portal_listings
    priority: 5
    enabled: false                 # 기본 비활성. 착수 전 반드시 PM 승인.
    requires_review: true          # robots·약관 검토 통과 전 수집 금지
    legal: portal_scrape
    provider: "포털 부동산(네이버 등)"
    endpoint: TBD
    target_table: listing
    cadence: hourly
    robots:
      respect: true                # robots.py 로 사전 확인 필수(SR-004 SR4-3)
      obey_crawl_delay: true
    rate_limit: { min_interval_sec: 3.0, jitter_sec: 2.0 }   # 포털은 더 보수적으로
    notes: >
      호가는 실거래(trade)와 다른 신뢰도의 데이터 — 절대 혼합 금지, listing 에만 적재.
      허위·미끼·중복 가능(trust_score·duplicate_of 로 처리). 재배포·판매 금지.
      공공API만으로 서비스가 성립해야 하므로 이 소스는 '있으면 좋은' 부가 신호일 뿐이다.
