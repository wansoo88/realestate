# nginx-realestate.conf — **호스트 nginx** 에 추가할 서버블록
#
# 설계: docs/02-design/security.md §3.2 · §4.3
#
# ⚠️ **이 파일은 인증서가 이미 발급된 뒤에 배치한다.** (DEP-2)
#    443 블록이 `ssl_certificate` 를 요구하는데 그 파일은 certbot 이 만든다.
#    없는 상태로 배치하면 `nginx -t` 가 실패하고 절차가 막힌다.
#    → 먼저 `nginx-realestate-bootstrap.conf` 로 발급받는다. 순서는 DEPLOY.md §5-5.
#
# ⚠️ **`add_header` 는 상속되지 않는다** (DEP-1)
#    nginx 규칙: 하위 레벨에 `add_header` 가 **하나라도** 있으면 상위 레벨의
#    `add_header` 를 **전혀 상속하지 않는다.** `always` 플래그는 오류응답 포함
#    여부를 정할 뿐 상속과 무관하다.
#    그래서 Cache-Control 을 붙이는 location 마다 **보안헤더 5종을 다시 적는다.**
#    빠뜨리면 그 경로만 조용히 무방비가 된다 — 특히 `/index.html` 은 사용자가
#    실제로 여는 문서라 거기서 `X-Frame-Options` 가 빠지면 클릭재킹 방어가 사라진다.
#    (`try_files ... /index.html` 은 내부 리다이렉트라 `GET /` 도 결국 그 location 을 탄다.)
#    누락은 사람 눈이 아니라 **DEPLOY.md §5-6 `check_headers()` 가 4경로에서 실검증**하고,
#    저장소 쪽은 `backend/tests/test_deploy_config.py` 가 정적으로 막는다.
#
# ⚠️ **CSP (SR15-4) — 토큰을 httpOnly 쿠키로 옮긴 뒤 남는 위험이 세션 라이딩이다**
#    HttpOnly 는 토큰의 **반출**만 막는다. XSS 가 그 탭 안에서 `fetch('/api/...',
#    {credentials:'include'})` 를 부르거나 `/auth/refresh` 를 직접 때리는 건 못 막는다 —
#    브라우저가 쿠키를 알아서 실어 보내기 때문이다. **CSP 가 그 마지막 층이다:**
#    스크립트 출처를 좁혀 주입 코드가 애초에 실행되지 못하게 한다.
#
#    아래 값의 각 출처는 **추측이 아니라 카카오맵 SDK 4.5.13 을 실제로 내려받아**
#    URL 생성부를 읽고 정한 것이다(근거는 §CSP 근거 주석 참조). `*` 는 쓰지 않는다.
#
#    ⚠️ **처음 올릴 때는 Report-Only 로 먼저 올린다.** 잘못 좁히면 지도가 죽는데,
#       그때 화면만 보고는 원인을 못 찾는다. 절차는 DEPLOY.md §5-5(4)/(5).
#
# ⚠️ 이 서버의 nginx 에는 이미 다른 실서비스(autobtc·itsmine)의 서버블록이 있다.
#    **그 파일들은 건드리지 않는다.** 이 파일만 새로 놓고 reload 한다.
#      배치: /etc/nginx/sites-available/realestate.conf
#      활성: ln -s ../sites-available/realestate.conf /etc/nginx/sites-enabled/
#    (배포판에 따라 /etc/nginx/conf.d/realestate.conf 로 바로 놓기도 한다 — DEPLOY.md §5)
#
# 채워야 할 값
#   <APP_ROOT>  : 서버에 체크아웃한 저장소 경로 (예: /opt/realestate)
#   API 포트     : docker-compose.deploy.yml 의 API_BIND_PORT 와 같아야 한다(기본 8013)
#
# ⚠️ limit_req_zone 은 **http 블록에만** 놓을 수 있다. 호스트 nginx 에 이미 같은 이름의
#    zone 이 있으면 "duplicate zone" 으로 nginx 가 통째로 뜨지 않는다 —
#    그러면 **동거 서비스까지 같이 죽는다.** 그래서 이름에 프로젝트 접두어를 붙였고,
#    DEPLOY.md 는 reload 전에 `nginx -t` 를 반드시 거치게 해 놓았다.

limit_req_zone $binary_remote_addr zone=re_api:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=re_auth:10m rate=1r/s;

# ---------------------------------------------------------------------------
# CSP 값 — **한 곳에서만 정의한다** (SR15-4)
# ---------------------------------------------------------------------------
# `add_header` 는 상속되지 않아서 세 블록에 각각 적어야 하는데(DEP-1), 값을 세 번
# 손으로 적으면 언젠가 하나만 고쳐진다. 값은 map 으로 한 번 정의하고 블록에서는
# 변수만 참조한다 — **값이 갈라질 수 없다.**
#
# ── 각 출처의 근거 (2026-07-26, 카카오맵 SDK v4.5.13 실물 확인) ──────────────
# 로더(`https://dapi.kakao.com/v2/maps/sdk.js`)를 실제로 내려받아 URL 생성부를 읽었다.
# 추측한 출처는 하나도 없고, 쓰지 않는 기능(로드뷰·교통정보)의 출처는 **일부러 뺐다.**
#
#   script-src
#     · dapi.kakao.com   MapView.tsx 가 `<script src=".../v2/maps/sdk.js">` 로 로더를 붙인다.
#     · t1.daumcdn.net   그 로더가 다시 붙이는 실제 SDK:
#                          /mapjsapi/js/main/4.5.13/kakao.js
#                          /mapjsapi/js/libs/clusterer/1.1.1/clusterer.js  (libraries=clusterer)
#     · 'unsafe-eval' 은 **넣지 않는다.** SDK 에 `try{eval("document.namespaces")}catch{}`
#       한 줄이 있으나 IE VML 감지용이고 try/catch 안이라, 차단돼도 지도는 정상 동작한다.
#       Report-Only 단계에서 이 위반 1건이 보이는 것은 **정상이다** — 보고 놀라서
#       'unsafe-eval' 을 넣으면 CSP 의 핵심 방어가 통째로 무너진다.
#
#   img-src (지도 타일·마커·컨트롤 이미지. 전부 <img>, 데이터URI·워커·iframe 없음)
#     · mts.daumcdn.net  타일: URI_FUNC.ROADMAP/ROADMAP_HD → mts.daumcdn.net/api/v1/tile/...
#     · t1.daumcdn.net   마커·컨트롤 스프라이트: /mapjsapi/images/, /localimg/localimages/07/mapjsapi/
#     · s1.daumcdn.net   범위 밖 빈 타일: /dmaps/apis/white.png
#     · `data:` 는 넣지 않았다 — 현재 빌드 산출물에 데이터URI 이미지가 0건이다.
#       나중에 4KB 미만 아이콘을 넣으면 vite 가 data: 로 인라인하므로 그때 추가한다.
#
#   connect-src 'self'
#     · 기본 지도 + clusterer 는 **XHR/fetch 를 전혀 하지 않는다.** SDK 안의 유일한
#       XHR 은 로드뷰 검색(spi.map.kakao.com)이고 우리는 로드뷰를 쓰지 않는다.
#       (`services` 라이브러리를 추가하면 dapi.kakao.com 이 connect-src 에 필요해진다.)
#     · 우리 API 는 같은 오리진(`/api/...`)이라 'self' 로 충분하다.
#
#   style-src 'self' 'unsafe-inline'
#     · **어쩔 수 없다.** SDK 가 지도 판(pane)을 배치할 때 `style.cssText +=
#       "left:0;top:0;width:100%;height:100%;touch-action:none"` 를 쓰고, SVG 마커에
#       `setAttribute("style", ...)` 를 쓴다. 둘 다 CSP 의 inline-style 검사를 탄다 —
#       빼면 지도가 무너진다(개별 속성 대입 `el.style.top=...` 만 쓴다면 뺄 수 있다).
#     · 위험도는 script-src 의 'unsafe-inline' 과 전혀 다르다. 스크립트 실행 경로는
#       그대로 막혀 있고, 여기서 열리는 건 스타일 주입뿐이다.
#
#   그 밖 — object-src 'none'(플러그인 없음) · base-uri 'none'(<base> 로 상대경로를
#   외부로 돌리는 우회 차단) · form-action 'self'(폼 탈취 차단) ·
#   frame-ancestors 'none'(X-Frame-Options DENY 의 CSP 판. 둘 다 둔다 — 구형 브라우저 대비).
#   default-src 'self' 가 media/manifest/worker/frame 을 전부 덮으므로 따로 적지 않는다.
map $host $re_csp {
    default "default-src 'self'; script-src 'self' https://dapi.kakao.com https://t1.daumcdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' https://t1.daumcdn.net https://mts.daumcdn.net https://s1.daumcdn.net; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 80;
    listen [::]:80;
    server_name realestate.utilverse.info;

    # certbot 갱신용. 이 경로만 평문으로 남긴다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # ⚠️ **`http2 on;` 을 쓰지 않는다.** 그 문법은 nginx 1.25.1 이상이고,
    #    이 서버의 호스트 nginx 는 **1.18.0 (Ubuntu)** 다. 1.18 에서는
    #      nginx: [emerg] unknown directive "http2"
    #    로 `nginx -t` 가 실패하고, 그러면 배포 절차가 §5-5(3)에서 통째로 막힌다.
    #    (DEPLOY.md §5-5(0) 사전 문법검사에서 실제로 이렇게 걸렸다 — 2026-07-26.)
    #    1.18 문법인 `listen ... ssl http2` 는 신버전에서도 계속 동작한다(경고만 뜬다).
    #    호스트 nginx 를 1.25+ 로 올리면 그때 `listen 443 ssl;` + `http2 on;` 으로 바꾼다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name realestate.utilverse.info;

    # certbot --nginx 로 발급하면 아래 경로가 자동으로 채워진다.
    ssl_certificate     /etc/letsencrypt/live/realestate.utilverse.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realestate.utilverse.info/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:re_ssl:5m;
    ssl_session_timeout 1h;

    server_tokens off;

    # 개인 금융정보를 다루는 서비스다. 헤더는 항상(always) 붙인다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy $re_csp always;

    client_max_body_size 1m;      # 파일 업로드가 없는 서비스다

    access_log /var/log/nginx/realestate.access.log;
    error_log  /var/log/nginx/realestate.error.log;

    # --- 인증: 크리덴셜 스터핑 방어 ---------------------------------------
    # 여기를 더 강하게 조이는 이유는 보안뿐이 아니다. 로그인 1건마다 Argon2 가
    # 19MiB 를 잡는다(SR8-1). rate limit 이 **메모리 방어선이기도 하다.**
    # 프록시 헤더는 `include /etc/nginx/proxy_params` 대신 직접 적는다.
    # 그 파일은 배포판마다 있기도 없기도 한데, 없으면 `nginx -t` 가 실패하고
    # 그 상태로 reload 하면 **동거 서비스까지 같이 죽는다.** 의존을 없앤다.
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=re_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8013;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 앱이 과부하 시 503 + Retry-After 를 준다(SR8-2). 그대로 통과시킨다 —
        # nginx 가 502 로 덮어쓰면 클라이언트가 재시도해도 되는 상황인지 알 수 없다.
        proxy_intercept_errors off;
    }

    location /api/ {
        limit_req zone=re_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8013;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_intercept_errors off;
    }

    # --- 프론트 정적 파일 -------------------------------------------------
    # `npm run build` 결과물. **서버에서 빌드하지 않는다** — vite 빌드가
    # 이 서버 여유 메모리보다 많이 먹는다(DEPLOY.md §4).
    location / {
        root <APP_ROOT>/frontend/dist;
        try_files $uri $uri/ /index.html;      # SPA 라우팅
        # 이 블록에는 add_header 가 없다 → 서버 레벨 보안헤더 4종을 그대로 상속한다.

        location ~* \.(js|css|woff2?|png|jpg|svg)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";

            # ↓ add_header 를 썼으므로 상위 5종이 전부 끊긴다. 다시 적는다(DEP-1).
            #   정적 자산에서 특히 중요한 건 nosniff 다 — JS/CSS 를 다른 타입으로
            #   해석시키는 공격을 막는다.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy $re_csp always;
        }
    }

    # index.html 은 캐시하지 않는다 — 배포해도 옛 화면이 남는다.
    location = /index.html {
        root <APP_ROOT>/frontend/dist;
        add_header Cache-Control "no-store";

        # ↓ **여기가 가장 중요하다.** 사용자가 실제로 여는 문서이고,
        #   `GET /` 도 try_files 내부 리다이렉트로 이 location 을 탄다.
        #   5종을 다시 적지 않으면 본 화면의 클릭재킹 방어가 통째로 사라진다(DEP-1).
        #   CSP 도 마찬가지다 — **CSP 가 실제로 일하는 문서가 바로 이 응답이다.**
        #   정적 자산에만 붙고 여기 빠지면 방어가 0 인데 헤더는 있는 것처럼 보인다.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $re_csp always;
    }
}
