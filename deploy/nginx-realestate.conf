# nginx-realestate.conf — **호스트 nginx** 에 추가할 서버블록
#
# 설계: docs/02-design/security.md §3.2 · §4.3
#
# ⚠️ **이 파일은 인증서가 이미 발급된 뒤에 배치한다.** (DEP-2)
#    443 블록이 `ssl_certificate` 를 요구하는데 그 파일은 certbot 이 만든다.
#    없는 상태로 배치하면 `nginx -t` 가 실패하고 절차가 막힌다.
#    → 먼저 `nginx-realestate-bootstrap.conf` 로 발급받는다. 순서는 DEPLOY.md §5-5.
#
# ⚠️ **`add_header` 는 상속되지 않는다** (DEP-1)
#    nginx 규칙: 하위 레벨에 `add_header` 가 **하나라도** 있으면 상위 레벨의
#    `add_header` 를 **전혀 상속하지 않는다.** `always` 플래그는 오류응답 포함
#    여부를 정할 뿐 상속과 무관하다.
#    그래서 Cache-Control 을 붙이는 location 마다 **보안헤더 4종을 다시 적는다.**
#    빠뜨리면 그 경로만 조용히 무방비가 된다 — 특히 `/index.html` 은 사용자가
#    실제로 여는 문서라 거기서 `X-Frame-Options` 가 빠지면 클릭재킹 방어가 사라진다.
#    (`try_files ... /index.html` 은 내부 리다이렉트라 `GET /` 도 결국 그 location 을 탄다.)
#
# ⚠️ 이 서버의 nginx 에는 이미 다른 실서비스(autobtc·itsmine)의 서버블록이 있다.
#    **그 파일들은 건드리지 않는다.** 이 파일만 새로 놓고 reload 한다.
#      배치: /etc/nginx/sites-available/realestate.conf
#      활성: ln -s ../sites-available/realestate.conf /etc/nginx/sites-enabled/
#    (배포판에 따라 /etc/nginx/conf.d/realestate.conf 로 바로 놓기도 한다 — DEPLOY.md §5)
#
# 채워야 할 값
#   <APP_ROOT>  : 서버에 체크아웃한 저장소 경로 (예: /opt/realestate)
#   API 포트     : docker-compose.deploy.yml 의 API_BIND_PORT 와 같아야 한다(기본 8013)
#
# ⚠️ limit_req_zone 은 **http 블록에만** 놓을 수 있다. 호스트 nginx 에 이미 같은 이름의
#    zone 이 있으면 "duplicate zone" 으로 nginx 가 통째로 뜨지 않는다 —
#    그러면 **동거 서비스까지 같이 죽는다.** 그래서 이름에 프로젝트 접두어를 붙였고,
#    DEPLOY.md 는 reload 전에 `nginx -t` 를 반드시 거치게 해 놓았다.

limit_req_zone $binary_remote_addr zone=re_api:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=re_auth:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name realestate.utilverse.info;

    # certbot 갱신용. 이 경로만 평문으로 남긴다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name realestate.utilverse.info;

    # certbot --nginx 로 발급하면 아래 경로가 자동으로 채워진다.
    ssl_certificate     /etc/letsencrypt/live/realestate.utilverse.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realestate.utilverse.info/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:re_ssl:5m;
    ssl_session_timeout 1h;

    server_tokens off;

    # 개인 금융정보를 다루는 서비스다. 헤더는 항상(always) 붙인다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 1m;      # 파일 업로드가 없는 서비스다

    access_log /var/log/nginx/realestate.access.log;
    error_log  /var/log/nginx/realestate.error.log;

    # --- 인증: 크리덴셜 스터핑 방어 ---------------------------------------
    # 여기를 더 강하게 조이는 이유는 보안뿐이 아니다. 로그인 1건마다 Argon2 가
    # 19MiB 를 잡는다(SR8-1). rate limit 이 **메모리 방어선이기도 하다.**
    # 프록시 헤더는 `include /etc/nginx/proxy_params` 대신 직접 적는다.
    # 그 파일은 배포판마다 있기도 없기도 한데, 없으면 `nginx -t` 가 실패하고
    # 그 상태로 reload 하면 **동거 서비스까지 같이 죽는다.** 의존을 없앤다.
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=re_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8013;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 앱이 과부하 시 503 + Retry-After 를 준다(SR8-2). 그대로 통과시킨다 —
        # nginx 가 502 로 덮어쓰면 클라이언트가 재시도해도 되는 상황인지 알 수 없다.
        proxy_intercept_errors off;
    }

    location /api/ {
        limit_req zone=re_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8013;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_intercept_errors off;
    }

    # --- 프론트 정적 파일 -------------------------------------------------
    # `npm run build` 결과물. **서버에서 빌드하지 않는다** — vite 빌드가
    # 이 서버 여유 메모리보다 많이 먹는다(DEPLOY.md §4).
    location / {
        root <APP_ROOT>/frontend/dist;
        try_files $uri $uri/ /index.html;      # SPA 라우팅
        # 이 블록에는 add_header 가 없다 → 서버 레벨 보안헤더 4종을 그대로 상속한다.

        location ~* \.(js|css|woff2?|png|jpg|svg)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";

            # ↓ add_header 를 썼으므로 상위 4종이 전부 끊긴다. 다시 적는다(DEP-1).
            #   정적 자산에서 특히 중요한 건 nosniff 다 — JS/CSS 를 다른 타입으로
            #   해석시키는 공격을 막는다.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
        }
    }

    # index.html 은 캐시하지 않는다 — 배포해도 옛 화면이 남는다.
    location = /index.html {
        root <APP_ROOT>/frontend/dist;
        add_header Cache-Control "no-store";

        # ↓ **여기가 가장 중요하다.** 사용자가 실제로 여는 문서이고,
        #   `GET /` 도 try_files 내부 리다이렉트로 이 location 을 탄다.
        #   4종을 다시 적지 않으면 본 화면의 클릭재킹 방어가 통째로 사라진다(DEP-1).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
}
