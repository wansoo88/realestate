# nginx-realestate-bootstrap.conf — **인증서 발급 전용 임시 블록 (HTTP 전용)**
#
# 왜 이 파일이 따로 있나 (DEP-2)
# ------------------------------
# 본 설정(`nginx-realestate.conf`)에는 `listen 443 ssl` 과
# `ssl_certificate /etc/letsencrypt/live/<도메인>/fullchain.pem` 이 있다.
# 그런데 그 인증서 파일은 **certbot 을 돌려야 생긴다.** 없는 상태로 배치하면
#
#     nginx -t → [emerg] cannot load certificate ... No such file or directory
#
# 로 실패하고, 그 뒤 `certbot --nginx` 도 깨진 설정을 파싱하다 실패한다. 앞으로 못 간다.
# 여기서 진짜 위험은 막힌 절차가 아니라, **막힌 걸 운영자가 손으로 고치려 드는 것**이다.
# 그 순간 동거 실서비스(autobtc·itsmine)가 위태로워진다.
#
# 그래서 순서를 나눈다:
#   1) 이 파일(HTTP 전용, 인증서 참조 없음) 배치 → nginx -t 통과 → reload
#   2) certbot certonly --webroot 로 인증서 발급
#   3) 본 nginx-realestate.conf 로 교체 → nginx -t 통과 → reload
#
# 이 파일은 2단계가 끝나면 **본 설정으로 대체되어 사라진다.** (DEPLOY.md §5-5)

server {
    listen 80;
    listen [::]:80;
    server_name realestate.utilverse.info;

    server_tokens off;

    # certbot --webroot 가 이 경로에 검증 파일을 놓는다.
    # 디렉터리는 미리 만들어 둬야 한다: sudo mkdir -p /var/www/certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 발급 전에는 서비스가 없다. 다른 경로는 전부 막는다 —
    # 이 단계에서 앱을 열어 둘 이유가 없고, 열면 평문 HTTP 로 인증 API 가 노출된다.
    location / {
        return 404;
    }
}
