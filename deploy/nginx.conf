# nginx.conf — 리버스 프록시 · TLS 종단
# 설계: docs/02-design/security.md §3.2, §4.3
#
# ⚠️ 이 설정은 배포 전 실제 도메인·인증서 경로로 채워야 한다.
#    <DOMAIN> 플레이스홀더가 남아 있으면 nginx 가 뜨지 않는다(의도적).

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

server {
    listen 80;
    server_name <DOMAIN>;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name <DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 서버 종류·버전 숨김
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 1m;   # 파일 업로드가 없는 서비스다

    # 로그인·회원가입은 더 강하게 제한 (크리덴셜 스터핑 방어)
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params_custom;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params_custom;

        # SSE(추천 진행률 스트리밍)를 위해 버퍼링 해제
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;   # SPA 라우팅
    }
}
