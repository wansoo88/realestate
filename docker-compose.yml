# docker-compose.yml — 부동산 AI 자문 시스템
# 설계: docs/02-design/architecture.md · 보안: docs/02-design/security.md §4.2
#
# ⚠️ db · redis 에 절대 `ports:` 를 추가하지 말 것.
#    Docker 는 ufw 규칙을 우회해 호스트 포트를 열어버린다. 방화벽만 믿으면 안 된다.
#    (security.md T1 — 5432 스캔 → 자산 테이블 덤프)
#
# 네트워크 분리
#   edge : 외부 통신 가능. nginx 인바운드 + 워커의 아웃바운드(공공API·Claude API)
#   data : internal=true → 외부 인터넷 단절. db·redis 는 여기에만 둔다.
#
# 메모리 제한 (SR8-1)
#   이 서버에는 **다른 실서비스가 함께 돈다.** 우리 스택이 폭주해도 그쪽으로
#   번지지 않도록 컨테이너마다 상한을 둔다. 제한이 없으면 OOM Killer 가
#   "가장 큰 프로세스"를 고르는데, 그게 우리가 아닐 수 있다.
#   memswap_limit 을 mem_limit 과 같게 둬 스왑으로 새는 것도 막는다
#   (스왑으로 넘어가면 안 죽고 대신 서버 전체가 느려진다 — 더 나쁘다).
#   ⚠️ 아래 합계는 이 서버의 관측 여유(332MB)를 넘는다. 전체 스택 동시 기동은
#      배포 전에 사양을 다시 봐야 한다(re-pm 보고 · G5 판단 사항).

name: realestate

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - api
    networks: [edge]

  api:
    build: ./backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      APP_ROLE: api
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [edge, data]
    # ports 없음 — nginx 를 통해서만 접근
    # 파이썬 런타임(~120MB) + Argon2 동시 4건(4×19MiB≈76MB) + 여유
    mem_limit: 256m
    memswap_limit: 256m

  worker-agent:
    build: ./backend
    restart: unless-stopped
    command: python -m app.worker --queue analyze
    env_file: .env
    environment:
      APP_ROLE: worker-agent
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [edge, data]   # edge 필요: Claude API 아웃바운드
    # LLM 응답 JSON 을 다루는 정도 — 해시 연산 없음
    mem_limit: 192m
    memswap_limit: 192m

  worker-ingest:
    build: ./backend
    restart: unless-stopped
    command: python -m app.worker --queue ingest
    env_file: .env
    environment:
      APP_ROLE: worker-ingest
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [edge, data]   # edge 필요: 공공 오픈API 아웃바운드
    # 공공API 응답 파싱 — 대량 배치 시 여기가 먼저 늘어난다
    mem_limit: 192m
    memswap_limit: 192m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly no
    volumes:
      - redisdata:/data
    networks: [data]
    # ports 없음 (의도적)

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    # ports 없음 (의도적) — 외부에서 절대 접근 불가

networks:
  edge:
  data:
    internal: true

volumes:
  pgdata:
  redisdata:
  certbot-conf:
